# Model Configuration
# Efficient Financial Sentiment Fine-Tuning with LoRA and QLoRA

# Dedicated base model for the research project
default_model: "Qwen/Qwen2.5-3B-Instruct"

models:
  "Qwen/Qwen2.5-3B-Instruct":
    size: "3B"
    parameter_count_b: 3.09
    min_vram_gb:
      zero_shot: 8.0
      lora_16bit: 13.0
      qlora_4bit: 6.5
    recommended_hardware: "Google Colab T4 GPU (15GB VRAM) / Kaggle T4 or P100"
    notes: >
      Primary research model (3.09B parameters).
      Fits cleanly into standard cloud GPUs across all experiments:
      Zero-Shot (~8GB VRAM), 16-bit LoRA (~13GB VRAM), and 4-bit QLoRA (~6.5GB VRAM).
