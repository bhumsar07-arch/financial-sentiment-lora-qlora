# Base Experiment Configuration
# Efficient Financial Sentiment Fine-Tuning with LoRA and QLoRA

experiment:
  name: "financial-sentiment-peft-benchmark"
  project_title: "Efficient Financial Sentiment Fine-Tuning with LoRA and QLoRA"
  default_model: "Qwen/Qwen2.5-3B-Instruct"
  seed: 42

dataset:
  name: "takala/financial_phrasebank"
  config: "sentences_50agree"
  task_type: "classification"
  num_classes: 3
  labels:
    0: "negative"
    1: "neutral"
    2: "positive"
  splits:
    train_ratio: 0.70
    val_ratio: 0.15
    test_ratio: 0.15
    stratify_by: "label"

prompt:
  system_instruction: "You are a financial sentiment classifier."
  format: |
    You are a financial sentiment classifier.

    Classify the following financial statement as exactly one of:

    positive
    negative
    neutral

    Statement:
    {sentence}

    Answer:

training:
  epochs: 3
  learning_rate: 0.0002 # 2e-4
  max_sequence_length: 256
  micro_batch_size: 1
  gradient_accumulation_steps: 8 # Effective batch size = 8
  warmup_ratio: 0.05
  weight_decay: 0.01
  optimizer: "adamw_torch"
  gradient_checkpointing: true
  logging_steps: 10
  eval_strategy: "epoch"
  save_strategy: "epoch"
  save_total_limit: 1
  load_best_model_at_end: true
  metric_for_best_model: "eval_macro_f1"
  greater_is_better: true

generation:
  max_new_tokens: 8
  temperature: 0.01
  top_p: 0.95
  do_sample: false

ablations:
  ranks: [4, 8, 16, 32]
  sequence_lengths: [128, 256, 512]
  learning_rates: [0.0001, 0.0002, 0.0005]
